[project]
name = "gosim26-observer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "highspy>=1.15.1",
    "orjson>=3.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scipy>=1.18.1",
]

[tool.ruff]
# v3/agents/ 要在平台的 Python 3.12 上运行，入门包也要求兼容 3.9，所以按 3.9 检查语法
target-version = "py39"
line-length = 130
# 原样复制自官方入门包的文件不改动，便于与 kit 更新比对
extend-exclude = ["v3/agents/*/protocol.py"]
# v3 的脚本和测试以 v3/ 为根导入 tools、agents
src = [".", "v3"]

[tool.pytest.ini_options]
# v3/runs/ 下保留有需要位置参数的实验脚本，不应被默认测试收集。v3 测试会导入 v3/kit 自带的 challenge 包，
# 与 v4 锁定的上游引擎同名冲突，所以单独运行：uv run pytest -q v3/tests
testpaths = ["telemetry-worker/client", "v4/tests"]
pythonpath = ["."]
